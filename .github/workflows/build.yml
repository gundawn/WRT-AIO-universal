name: Build Xiaomi AX3000T firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      OPENWRT_VERSION: "25.12.6"
      TARGET: "mediatek/filogic"
      PROFILE: "xiaomi_mi-router-ax3000t"

      IMAGEBUILDER_URL: "https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/openwrt-imagebuilder-25.12.6-mediatek-filogic.Linux-x86_64.tar.zst"

      AURORA_FEED: "https://openwrt.eamonxg.fun/snapshots/apk/packages.adb"

      NETSHIFT_VERSION: "0.9.12"
      NETSHIFT_RELEASE_URL: "https://github.com/yandexru45/netshift/releases/download/0.9.12"

      SINGBOX_SHA256: "ea8297584c4b624a2349409e4ac53b2fe0cc284c88b2c6dfb6f51efcf7d42195"

    steps:
      - name: Checkout firmware configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl zstd squashfs-tools xz-utils

      - name: Check input files
        run: |
          set -euo pipefail
          test -s custom-files.tar.gz || { echo "ERROR: custom-files.tar.gz not found"; exit 1; }
          test -s packages.txt || { echo "ERROR: packages.txt not found"; exit 1; }
          echo "Input files present."

      - name: Download OpenWrt ImageBuilder
        run: |
          set -euo pipefail
          wget -q --tries=3 --timeout=60 "$IMAGEBUILDER_URL" -O imagebuilder.tar.zst
          mkdir imagebuilder
          tar --zstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

          test -f imagebuilder/Makefile
          test -f imagebuilder/repositories
          echo "ImageBuilder extracted successfully."

      - name: Restore configuration archive
        run: |
          set -euo pipefail
          mkdir -p imagebuilder/files
          tar -xzf custom-files.tar.gz -C imagebuilder/files

          test -x imagebuilder/files/usr/bin/sing-box || { echo "ERROR: sing-box binary missing from archive"; exit 1; }

          ACTUAL_HASH="$(sha256sum imagebuilder/files/usr/bin/sing-box | awk '{print $1}')"
          if [ "$ACTUAL_HASH" != "$SINGBOX_SHA256" ]; then
            echo "ERROR: Extended Lite binary checksum mismatch"
            echo "Expected: $SINGBOX_SHA256"
            echo "Actual:   $ACTUAL_HASH"
            exit 1
          fi
          echo "Configuration archive and Sing-box verified."

      - name: Remove stale APK state and NetShift overlay files
        run: |
          set -euo pipefail
          FILES="imagebuilder/files"
          rm -f "$FILES/etc/apk/world"
          rm -f \
            "$FILES/usr/bin/netshift" \
            "$FILES/etc/init.d/netshift" \
            "$FILES/usr/share/luci/menu.d/luci-app-netshift.json" \
            "$FILES/usr/share/rpcd/acl.d/luci-app-netshift.json" \
            "$FILES/usr/lib/lua/luci/i18n/netshift.ru.lmo"
          rm -rf "$FILES/usr/lib/netshift"
          if [ -d "$FILES/www/luci-static/resources/view" ]; then
            find "$FILES/www/luci-static/resources/view" -maxdepth 1 -name 'netshift_*' -exec rm -rf {} +
          fi
          if [ -f "$FILES/etc/config/netshift" ]; then echo "NetShift configuration preserved."; fi
          echo "Stale APK state and copied NetShift package files removed."

      - name: Configure Aurora repository and signing keys
        run: |
          set -euo pipefail
          FILES="imagebuilder/files"
          mkdir -p imagebuilder/keys
          mkdir -p "$FILES/etc/apk/repositories.d"
          AURORA_PEM="$FILES/usr/share/aurora/feed/eamonxg.pem"
          test -s "$AURORA_PEM" || { echo "ERROR: EamonXG PEM key not found"; exit 1; }
          install -Dm644 "$AURORA_PEM" "$FILES/etc/apk/keys/eamonxg.pem"

          for DIR in "$FILES/etc/apk/keys" "$FILES/usr/share/aurora/feed"; do
            if [ -d "$DIR" ]; then
              find "$DIR" -maxdepth 1 -type f \( -name '*.pem' -o -name '*.pub' \) -exec cp -f {} imagebuilder/keys/ \;
            fi
          done

          if ! find imagebuilder/keys -maxdepth 1 -type f -name '*.pub' | grep -q .; then
            echo "ERROR: Aurora public signing key not found"; exit 1
          fi
          if ! find imagebuilder/keys -maxdepth 1 -type f -name '*.pem' | grep -q .; then
            echo "ERROR: Aurora PEM signing key not found"; exit 1
          fi

          TEMP_REPOSITORIES="$(mktemp)"
          { printf '@aurora %s\n' "$AURORA_FEED"; cat imagebuilder/repositories; } > "$TEMP_REPOSITORIES"
          mv "$TEMP_REPOSITORIES" imagebuilder/repositories

          python3 - <<'PY'
          from pathlib import Path
          root = Path("imagebuilder/files/etc/apk/repositories.d")
          feed = "https://openwrt.eamonxg.fun/snapshots/apk/packages.adb"
          root.mkdir(parents=True, exist_ok=True)
          for path in root.glob("*.list"):
              if path.name == "aurora.list": continue
              lines = path.read_text(errors="replace").splitlines()
              filtered = [line for line in lines if feed not in line]
              if filtered != lines:
                  path.write_text("\n".join(filtered) + ("\n" if filtered else ""))
          (root / "aurora.list").write_text(f"@aurora {feed}\n")
          PY
          echo "Aurora repository configured."
          find imagebuilder/keys -maxdepth 1 -type f -printf '%f\n'

      - name: Download NetShift APK packages
        run: |
          set -euo pipefail
          mkdir -p imagebuilder/packages
          curl -fL --retry 3 "$NETSHIFT_RELEASE_URL/netshift-0.9.12-r1.apk" -o imagebuilder/packages/netshift-0.9.12-r1.apk
          curl -fL --retry 3 "$NETSHIFT_RELEASE_URL/luci-app-netshift-0.9.12-r1.apk" -o imagebuilder/packages/luci-app-netshift-0.9.12-r1.apk
          curl -fL --retry 3 "$NETSHIFT_RELEASE_URL/luci-i18n-netshift-ru-0.9.12.apk" -o /tmp/luci-i18n-netshift-ru.apk
          mv /tmp/luci-i18n-netshift-ru.apk imagebuilder/packages/luci-i18n-netshift-ru-0.261025.30010.apk

          test -s imagebuilder/packages/netshift-0.9.12-r1.apk
          test -s imagebuilder/packages/luci-app-netshift-0.9.12-r1.apk
          test -s imagebuilder/packages/luci-i18n-netshift-ru-0.261025.30010.apk
          echo "All three NetShift APK packages downloaded."

      - name: Generate complete package list
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("packages.txt")
          output = Path("/tmp/packages.list")
          excluded = {"base-files", "kernel", "libc"}
          aurora = {"luci-app-aurora-config","luci-i18n-aurora-config-ru","luci-theme-aurora","luci-mod-dashboard","luci-i18n-dashboard-ru"}
          netshift = {"netshift","luci-app-netshift","luci-i18n-netshift-ru"}

          packages = set()
          for line_number, line in enumerate(source.read_text().splitlines(), start=1):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              # Убираем хвост ><hash>=, если он есть
              entry = line.split('>')[0].strip()
              if not entry:
                  continue
              # Версий в файле нет — считаем строку именем пакета как есть
              name = entry
              if name not in excluded:
                  packages.add(name)

          packages.update(aurora)
          packages.update(netshift)

          result = []
          for name in sorted(packages):
              if name in aurora: result.append(f"{name}@aurora")
              else: result.append(name)

          output.write_text("\n".join(result) + "\n")
          print(f"Generated {len(result)} package entries.")
          print("=== Generated package list ===")
          print("\n".join(result))
          if "libnghttp2-14" not in packages:
              raise SystemExit("ERROR: libnghttp2-14 missing")
          print("\nPackage list generated successfully.")
          PY

      - name: Verify ImageBuilder device profile
        working-directory: imagebuilder
        run: |
          set -euo pipefail
          make info > /tmp/imagebuilder-info.txt
          if ! grep -Fq "$PROFILE" /tmp/imagebuilder-info.txt; then
            echo "ERROR: Profile not found: $PROFILE"
            cat /tmp/imagebuilder-info.txt
            exit 1
          fi
          echo "Verified profile: $PROFILE"

      - name: Build firmware image
        working-directory: imagebuilder
        run: |
          set -euo pipefail
          PACKAGES="$(tr '\n' ' ' < /tmp/packages.list) -sing-box"
          echo "Building firmware for $PROFILE"
          echo "Package count: $(wc -l < /tmp/packages.list)"
          make image PROFILE="$PROFILE" PACKAGES="$PACKAGES" FILES="files" V=s

      - name: Verify generated firmware
        run: |
          set -euo pipefail
          IMAGE="$(find imagebuilder/bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*ax3000t*squashfs-sysupgrade.bin' -print -quit)"
          if [ -z "$IMAGE" ]; then
            echo "ERROR: AX3000T sysupgrade image not found"
            find imagebuilder/bin/targets/mediatek/filogic -maxdepth 1 -type f -print
            exit 1
          fi
          echo "Firmware image: $IMAGE"

          mkdir -p /tmp/ax3000t-check
          ROOT_MEMBER="$(tar -tf "$IMAGE" | grep -E '(^|/)root$' | head -n 1 || true)"
          if [ -z "$ROOT_MEMBER" ]; then echo "ERROR: Root filesystem not found"; exit 1; fi
          tar -xOf "$IMAGE" "$ROOT_MEMBER" > /tmp/ax3000t-check/root.squashfs
          sudo unsquashfs -d /tmp/ax3000t-check/rootfs /tmp/ax3000t-check/root.squashfs

          ROOT="/tmp/ax3000t-check/rootfs"
          APK_DB="$ROOT/lib/apk/db/installed"
          test -s "$APK_DB" || { echo "ERROR: APK installed database missing"; exit 1; }

          echo "=== Verify Sing-box Extended Lite ==="
          test -x "$ROOT/usr/bin/sing-box" || { echo "ERROR: sing-box binary missing"; exit 1; }
          ACTUAL_HASH="$(sha256sum "$ROOT/usr/bin/sing-box" | awk '{print $1}')"
          if [ "$ACTUAL_HASH" != "$SINGBOX_SHA256" ]; then
            echo "ERROR: Sing-box Extended Lite checksum mismatch"
            echo "Expected: $SINGBOX_SHA256"; echo "Actual:   $ACTUAL_HASH"; exit 1
          fi
          echo "Sing-box Extended Lite verified."

          echo "=== Verify installed APK package records ==="
          while IFS= read -r SPEC; do
            [ -n "$SPEC" ] || continue
            PACKAGE="${SPEC%%@*}"
            if ! grep -Fqx "P:$PACKAGE" "$APK_DB"; then echo "ERROR: Package not registered: $PACKAGE"; exit 1; fi
            echo "OK: $PACKAGE"
          done < /tmp/packages.list

          echo "=== Verify NetShift files ==="
          for FILE in usr/bin/netshift etc/init.d/netshift usr/share/luci/menu.d/luci-app-netshift.json usr/share/rpcd/acl.d/luci-app-netshift.json; do
            if [ ! -e "$ROOT/$FILE" ]; then echo "ERROR: NetShift file missing: $FILE"; exit 1; fi
            echo "OK: $FILE"
          done

          echo "=== Verify Aurora packages ==="
          for PACKAGE in luci-app-aurora-config luci-i18n-aurora-config-ru luci-theme-aurora luci-mod-dashboard luci-i18n-dashboard-ru; do
            grep -Fqx "P:$PACKAGE" "$APK_DB" || { echo "ERROR: Aurora package not registered: $PACKAGE"; exit 1; }
            echo "OK: $PACKAGE"
          done

          echo "=== Verify Aurora repository ==="
          AURORA_LIST="$ROOT/etc/apk/repositories.d/aurora.list"
          test -s "$AURORA_LIST" || { echo "ERROR: Aurora repository configuration missing"; exit 1; }
          grep -Fq "@aurora $AURORA_FEED" "$AURORA_LIST" || { echo "ERROR: Aurora tagged feed not configured"; cat "$AURORA_LIST"; exit 1; }
          echo "Aurora feed verified."

          echo "=== Verify Aurora world entries ==="
          WORLD="$ROOT/etc/apk/world"
          test -s "$WORLD" || { echo "ERROR: APK world file missing"; exit 1; }
          for PACKAGE in luci-app-aurora-config luci-i18n-aurora-config-ru luci-theme-aurora luci-mod-dashboard luci-i18n-dashboard-ru; do
            if ! grep -Fq "${PACKAGE}@aurora" "$WORLD"; then echo "ERROR: Aurora package is not pinned to Aurora feed: $PACKAGE"; cat "$WORLD"; exit 1; fi
          done
          echo "Aurora world entries verified."

          echo "=== Verify preserved configuration ==="
          if [ -f "$ROOT/etc/config/netshift" ]; then echo "NetShift configuration preserved."; else echo "WARNING: /etc/config/netshift not found"; fi
          if [ -f "$ROOT/etc/crontabs/root" ]; then
            if grep -Fq "0 5 * * * /sbin/reboot" "$ROOT/etc/crontabs/root"; then echo "Daily 05:00 reboot cron entry preserved."; else echo "WARNING: Daily 05:00 reboot entry not found."; fi
          else echo "WARNING: root crontab not found."; fi

          echo "=== Image verification complete ==="
          sha256sum "$IMAGE" | tee /tmp/ax3000t-image.sha256
          echo "$IMAGE" > /tmp/ax3000t-image-path

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ax3000t-openwrt-25.12.6
          path: |
            ${{ github.workspace }}/imagebuilder/bin/targets/mediatek/filogic/*ax3000t*squashfs-sysupgrade.bin
            ${{ github.workspace }}/imagebuilder/bin/targets/mediatek/filogic/*ax3000t*.manifest
            /tmp/ax3000t-image.sha256
          if-no-files-found: error
          retention-days: 30
