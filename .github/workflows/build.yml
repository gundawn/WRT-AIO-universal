
      - name: Generate complete package list
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("packages.txt")
          output = Path("/tmp/packages.list")

          if not source.is_file():
              raise SystemExit("ERROR: packages.txt not found")

          excluded = {
              "base-files",
              "kernel",
              "libc",
          }

          aurora = {
              "luci-app-aurora-config",
              "luci-i18n-aurora-config-ru",
              "luci-theme-aurora",
              "luci-mod-dashboard",
              "luci-i18n-dashboard-ru",
          }

          netshift = {
              "netshift",
              "luci-app-netshift",
              "luci-i18n-netshift-ru",
          }

          packages = set()

          for line in source.read_text().splitlines():
              fields = line.split()

              if not fields:
                  continue

              entry = fields[0]

              # Greedy match preserves numeric suffixes in package names:
              # libnghttp2-14-1.70.0-r1 -> libnghttp2-14
              match = re.match(r"^(.+)-([0-9][A-Za-z0-9.+~_-]*)$", entry)

              if not match:
                  continue

              name = match.group(1)

              if name in excluded:
                  continue

              packages.add(name)

          # Ensure all required application packages are present.
          packages.update(aurora)
          packages.update(netshift)

          # Aurora packages must come from the Aurora repository.
          result = []

          for name in sorted(packages):
              if name in aurora:
                  result.append(f"{name}@aurora")
              else:
                  result.append(name)

          output.write_text("\n".join(result) + "\n")

          print(f"Generated {len(result)} package entries.")
          print("Aurora packages:")
          for name in sorted(aurora):
              print(f"  {name}@aurora")

          print("NetShift packages:")
          for name in sorted(netshift):
              print(f"  {name}")

          if "libnghttp2-14" not in packages:
              raise SystemExit("ERROR: libnghttp2-14 missing from package list")

          print("Package list generated successfully.")
          PY

          echo "=== Generated package list ==="
          cat /tmp/packages.list
