
name: Build Redmi AX6 firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            rsync \
            file \
            curl \
            wget \
            zstd \
            python3 \
            squashfs-tools

      - name: Verify backup files
        shell: bash
        run: |
          set -euo pipefail

          test -s custom-files.tar.gz
          test -s packages.txt

          echo "=== Verifying custom-files.tar.gz ==="
          echo "5d565bb39bb5963bac48a16a1d8c8355935dc11e6998378e89837a3936dc2872  custom-files.tar.gz" | sha256sum -c -

          echo "=== Verifying packages.txt ==="
          echo "4ec6314d99914fc51c1ed42e65a31f858792f56286ca8d58bbee2a9b1a21b5e0  packages.txt" | sha256sum -c -

      - name: Download and verify OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/25.12.6/targets/qualcommax/ipq807x"
          ARCHIVE="openwrt-imagebuilder-25.12.6-qualcommax-ipq807x.Linux-x86_64.tar.zst"

          curl -fL "$BASE_URL/$ARCHIVE" -o "$ARCHIVE"
          curl -fL "$BASE_URL/sha256sums" -o sha256sums

          EXPECTED="$(awk -v f="$ARCHIVE" '
            {
              name=$2
              sub(/^\*/, "", name)
              if (name == f) {
                print $1
                exit
              }
            }
          ' sha256sums)"

          if [ -z "$EXPECTED" ]; then
            echo "ERROR: ImageBuilder checksum not found."
            exit 1
          fi

          echo "$EXPECTED  $ARCHIVE" | sha256sum -c -

          tar --zstd -xf "$ARCHIVE"

          mv \
            openwrt-imagebuilder-25.12.6-qualcommax-ipq807x.Linux-x86_64 \
            imagebuilder

          mkdir -p "$GITHUB_WORKSPACE/imagebuilder/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/imagebuilder/tmp" >> "$GITHUB_ENV"

      - name: Restore original configuration and files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p imagebuilder/files

          tar -xzpf custom-files.tar.gz -C imagebuilder/files

          echo "=== Checking restored Sing-box Extended Lite ==="

          test -s imagebuilder/files/usr/bin/sing-box

          echo "ea8297584c4b624a2349409e4ac53b2fe0cc284c88b2c6dfb6f51efcf7d42195  imagebuilder/files/usr/bin/sing-box" \
            | sha256sum -c -

          echo "Custom configuration restored."

      - name: Download official NetShift APK packages
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.9.12"
          RELEASE_URL="https://github.com/yandexru45/netshift/releases/download/$VERSION"

          mkdir -p imagebuilder/packages

          curl -fL \
            "$RELEASE_URL/netshift-0.9.12-r1.apk" \
            -o imagebuilder/packages/netshift-0.9.12-r1.apk

          curl -fL \
            "$RELEASE_URL/luci-app-netshift-0.9.12-r1.apk" \
            -o imagebuilder/packages/luci-app-netshift-0.9.12-r1.apk

          curl -fL \
            "$RELEASE_URL/luci-i18n-netshift-ru-0.9.12.apk" \
            -o imagebuilder/packages/luci-i18n-netshift-ru-0.9.12.apk

          echo "=== Verifying NetShift APK checksums ==="

          echo "af84753fc38c2cbabdce2c444050309c7dbd9b2d02b4f93e8dfe1a4c8f30cf72  imagebuilder/packages/netshift-0.9.12-r1.apk" \
            | sha256sum -c -

          echo "de285bf9d3b93be95074e80aabf5b4a280ffe36772acff82722f7bfe42a5ec12  imagebuilder/packages/luci-app-netshift-0.9.12-r1.apk" \
            | sha256sum -c -

          echo "50e8eb879e2973f419ca2c62815fd2a9e7346d0c5e7c3b2c733688e64ec59319  imagebuilder/packages/luci-i18n-netshift-ru-0.9.12.apk" \
            | sha256sum -c -

          echo "All three official NetShift APK packages verified."

      - name: Configure Aurora repository and signing keys
        shell: bash
        run: |
          set -euo pipefail

          cd imagebuilder

          AURORA_URL="https://openwrt.eamonxg.fun/snapshots/apk/packages.adb"

          echo "=== Configuring tagged Aurora repository ==="

          sed -i '\|openwrt.eamonxg.fun|d' repositories
          echo "@aurora $AURORA_URL" >> repositories

          mkdir -p keys
          mkdir -p files/etc/apk/keys

          if [ ! -d files/usr/share/aurora/feed ]; then
            echo "ERROR: Aurora feed keys directory missing from backup."
            exit 1
          fi

          find files/usr/share/aurora/feed \
            -maxdepth 1 \
            -type f \
            -name '*.pub' \
            -exec cp -f {} keys/ \;

          find files/usr/share/aurora/feed \
            -maxdepth 1 \
            -type f \
            -name '*.pub' \
            -exec cp -f {} files/etc/apk/keys/ \;

          if ! find keys -maxdepth 1 -type f -name '*.pub' -print -quit | grep -q .; then
            echo "ERROR: Aurora public signing key not found."
            exit 1
          fi

          echo "=== Aurora signing keys ==="
          ls -lh keys

          echo "=== Runtime APK repositories ==="

          mkdir -p files/etc/apk

          cp repositories files/etc/apk/repositories

          echo "Aurora repository and keys configured."

      - name: Remove stale APK world constraints
        shell: bash
        run: |
          set -euo pipefail

          rm -f imagebuilder/files/etc/apk/world

          echo "Old APK world constraints removed."
          echo "ImageBuilder will generate package constraints for the new image."

      - name: Prepare complete package selection
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re

          excluded = {
              "base-files",
              "kernel",
              "libc",
          }

          aurora = {
              "luci-app-aurora-config",
              "luci-i18n-aurora-config-ru",
              "luci-theme-aurora",
              "luci-mod-dashboard",
              "luci-i18n-dashboard-ru",
          }

          netshift = {
              "netshift",
              "luci-app-netshift",
              "luci-i18n-netshift-ru",
          }

          packages = set()

          with open("packages.txt", encoding="utf-8") as source:
              for line_number, line in enumerate(source, 1):
                  line = line.strip()

                  if not line:
                      continue

                  token = line.split()[0]

                  match = re.match(
                      r"^(.+)-([0-9][A-Za-z0-9.+~_-]*)$",
                      token
                  )

                  if not match:
                      raise SystemExit(
                          f"ERROR: Cannot parse package entry "
                          f"on line {line_number}: {token}"
                      )

                  name = match.group(1)

                  if name in excluded:
                      continue

                  if name in aurora:
                      packages.add(name + "@aurora")
                  else:
                      packages.add(name)

          for name in aurora:
              packages.add(name + "@aurora")

          for name in netshift:
              packages.add(name)

          with open("/tmp/packages.list", "w", encoding="utf-8") as output:
              output.write(" ".join(sorted(packages)))

          expected = set()

          with open("packages.txt", encoding="utf-8") as source:
              for line in source:
                  line = line.strip()

                  if not line:
                      continue

                  token = line.split()[0]
                  match = re.match(
                      r"^(.+)-([0-9][A-Za-z0-9.+~_-]*)$",
                      token
                  )

                  if not match:
                      continue

                  name = match.group(1)

                  if name not in excluded:
                      expected.add(name)

          expected.update(aurora)
          expected.update(netshift)

          with open("/tmp/expected-packages.txt", "w", encoding="utf-8") as output:
              output.write("\n".join(sorted(expected)) + "\n")

          print(f"Source package count: {len(expected)}")
          print(f"Final package specification count: {len(packages)}")

          print("\n=== Aurora packages ===")
          for name in sorted(aurora):
              print(name + "@aurora")

          print("\n=== NetShift packages ===")
          for name in sorted(netshift):
              print(name)

          print("\n=== Sing-box handling ===")
          print("Stock sing-box package retained in package selection.")
          print("Extended Lite binary restored from custom-files.tar.gz.")

          print("\n=== Correct package parser ===")
          print("libnghttp2-14 is retained as libnghttp2-14.")
          PY

          echo "=== Complete package selection ==="
          tr ' ' '\n' < /tmp/packages.list | sort

      - name: Verify Redmi AX6 ImageBuilder profile
        shell: bash
        run: |
          set -euo pipefail

          cd imagebuilder

          mkdir -p "$PWD/tmp"

          make info > /tmp/imagebuilder-profiles.txt

          if ! grep -F "redmi_ax6" /tmp/imagebuilder-profiles.txt; then
            echo "ERROR: Redmi AX6 profile not found."
            cat /tmp/imagebuilder-profiles.txt
            exit 1
          fi

          echo "Redmi AX6 profile confirmed."

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail

          cd imagebuilder

          PACKAGES="$(cat /tmp/packages.list)"

          echo "=== Building Redmi AX6 firmware ==="
          echo "OpenWrt: 25.12.6"
          echo "Target: qualcommax/ipq807x"
          echo "Profile: redmi_ax6"

          make image \
            PROFILE="redmi_ax6" \
            PACKAGES="$PACKAGES" \
            FILES="files"

      - name: Locate firmware image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(find imagebuilder/bin/targets/qualcommax/ipq807x \
            -maxdepth 1 \
            -type f \
            -name '*redmi_ax6-squashfs-sysupgrade.bin' \
            -print -quit)"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Redmi AX6 sysupgrade image not found."
            exit 1
          fi

          echo "=== Firmware image ==="
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          echo "$IMAGE" > /tmp/ax6-image-path

      - name: Verify firmware contents and package database
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(cat /tmp/ax6-image-path)"

          mkdir -p /tmp/ax6-check

          echo "=== Extracting firmware root filesystem ==="

          tar -xOf "$IMAGE" sysupgrade-redmi_ax6/root \
            > /tmp/ax6-check/root.squashfs

          sudo unsquashfs \
            -d /tmp/ax6-check/rootfs \
            /tmp/ax6-check/root.squashfs

          ROOT="/tmp/ax6-check/rootfs"
          APK_DB="$ROOT/lib/apk/db/installed"

          if [ ! -s "$APK_DB" ]; then
            echo "ERROR: APK installed database missing."
            exit 1
          fi

          echo "=== Checking Sing-box Extended Lite ==="

          sudo test -s "$ROOT/usr/bin/sing-box"

          SINGBOX_HASH="$(sudo sha256sum "$ROOT/usr/bin/sing-box" | awk '{print $1}')"

          echo "Sing-box SHA256: $SINGBOX_HASH"

          if [ "$SINGBOX_HASH" != "ea8297584c4b624a2349409e4ac53b2fe0cc284c88b2c6dfb6f51efcf7d42195" ]; then
            echo "ERROR: Sing-box Extended Lite binary mismatch."
            exit 1
          fi

          echo "Sing-box Extended Lite confirmed."

          echo "=== Checking original package set ==="

          MISSING=0

          while IFS= read -r PACKAGE; do
            [ -z "$PACKAGE" ] && continue

            if sudo grep -Fxq "P:$PACKAGE" "$APK_DB"; then
              echo "OK: $PACKAGE"
            else
              echo "MISSING: $PACKAGE"
              MISSING=$((MISSING + 1))
            fi
          done < /tmp/expected-packages.txt

          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: $MISSING original packages are missing."
            exit 1
          fi

          echo "All expected packages are registered."

          echo "=== Checking NetShift package registration ==="

          for PACKAGE in \
            netshift \
            luci-app-netshift \
            luci-i18n-netshift-ru
          do
            sudo grep -Fxq "P:$PACKAGE" "$APK_DB"
            echo "OK: $PACKAGE"
          done

          echo "=== Checking Aurora package registration ==="

          for PACKAGE in \
            luci-app-aurora-config \
            luci-i18n-aurora-config-ru \
            luci-theme-aurora \
            luci-mod-dashboard \
            luci-i18n-dashboard-ru
          do
            sudo grep -Fxq "P:$PACKAGE" "$APK_DB"
            echo "OK: $PACKAGE"
          done

          echo "=== Checking Sing-box package record ==="

          sudo grep -Fxq "P:sing-box" "$APK_DB"

          echo "Stock sing-box package record retained."
          echo "Custom Extended Lite binary verified separately."

          echo "=== Checking NetShift files ==="

          sudo test -s "$ROOT/usr/bin/netshift"
          sudo test -d "$ROOT/usr/lib/netshift"
          sudo test -f "$ROOT/etc/config/netshift"
          sudo test -f "$ROOT/etc/init.d/netshift"
          sudo test -f "$ROOT/usr/share/luci/menu.d/luci-app-netshift.json"
          sudo test -f "$ROOT/usr/share/rpcd/acl.d/luci-app-netshift.json"
          sudo test -d "$ROOT/www/luci-static/resources/view/netshift_ea5babe"

          echo "NetShift files confirmed."

          echo "=== Checking Aurora files ==="

          sudo test -d "$ROOT/usr/share/aurora"
          sudo test -f "$ROOT/etc/config/aurora"

          echo "Aurora files confirmed."

          echo "=== Checking runtime Aurora repository ==="

          sudo grep -Fq \
            "@aurora https://openwrt.eamonxg.fun/snapshots/apk/packages.adb" \
            "$ROOT/etc/apk/repositories"

          sudo test -s "$ROOT/etc/apk/keys/eamonxg.pub"

          echo "Aurora repository and signing key confirmed."

          echo "=== Checking router configuration ==="

          for CONFIG in \
            network \
            wireless \
            dhcp \
            firewall \
            netshift \
            aurora
          do
            sudo test -f "$ROOT/etc/config/$CONFIG"
            echo "OK: $CONFIG"
          done

          echo "=== Checking scheduled reboot ==="

          sudo test -f "$ROOT/etc/crontabs/root"

          if ! sudo grep -Fq '0 5 * * * /sbin/reboot' "$ROOT/etc/crontabs/root"; then
            echo "ERROR: Scheduled reboot entry missing."
            exit 1
          fi

          echo "Scheduled reboot confirmed."

          echo "=== Checking restored backup files ==="

          python3 - <<'PY'
          import os
          import tarfile
          import sys

          root = "/tmp/ax6-check/rootfs"
          archive = "custom-files.tar.gz"
          missing = []

          with tarfile.open(archive, "r:gz") as tar:
              for member in tar.getmembers():
                  if member.isdir():
                      continue

                  name = member.name

                  if name.startswith("./"):
                      name = name[2:]

                  name = name.lstrip("/")

                  if not name:
                      continue

                  path = os.path.join(root, name)

                  if not os.path.lexists(path):
                      missing.append(name)

          if missing:
              print("ERROR: Backup files missing from firmware:")
              for name in missing:
                  print(name)
              sys.exit(1)

          print("All files from custom-files.tar.gz are present.")
          PY

          echo "=== All mandatory firmware checks passed ==="

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6-openwrt-25.12.6
          path: |
            imagebuilder/bin/targets/qualcommax/ipq807x/*redmi_ax6-squashfs-sysupgrade.bin
            imagebuilder/bin/targets/qualcommax/ipq807x/*.manifest
          if-no-files-found: error
          retention-days: 30
