
name: Build Redmi AX6 firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync file wget zstd python3

      - name: Check backup files
        run: |
          test -s custom-files.tar.gz
          test -s packages.txt
          sha256sum custom-files.tar.gz packages.txt

      - name: Download ImageBuilder
        run: |
          wget -O imagebuilder.tar.zst \
            https://downloads.openwrt.org/releases/25.12.6/targets/qualcommax/ipq807x/openwrt-imagebuilder-25.12.6-qualcommax-ipq807x.Linux-x86_64.tar.zst

          tar --zstd -xf imagebuilder.tar.zst
          mv openwrt-imagebuilder-25.12.6-qualcommax-ipq807x.Linux-x86_64 imagebuilder

      - name: Restore custom files
        run: |
          mkdir -p imagebuilder/files
          tar -xzpf custom-files.tar.gz -C imagebuilder/files

      - name: Configure Aurora repository
        run: |
          cd imagebuilder

          FEED="https://openwrt.eamonxg.fun/snapshots/apk/packages.adb"

          grep -qxF "$FEED" repositories || echo "$FEED" >> repositories

          mkdir -p keys

          if [ -d files/usr/share/aurora/feed ]; then
            find files/usr/share/aurora/feed -maxdepth 1 \
              -type f \( -name '*.pem' -o -name '*.pub' \) \
              -exec cp -f {} keys/ \;
          fi

          if ! find keys -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "ERROR: Aurora signing keys not found in backup."
            exit 1
          fi

      - name: Prepare package list
        run: |
          python3 - <<'PY'
          import re

          excluded = {
              "base-files",
              "kernel",
              "libc",
              "sing-box",
              "netshift",
              "luci-app-netshift",
              "luci-i18n-netshift-ru",
          }

          packages = set()

          with open("packages.txt", encoding="utf-8") as source:
              for line in source:
                  line = line.strip()
                  if not line:
                      continue

                  name = line.split()[0]
                  name = re.sub(r'-[0-9].*$', '', name)

                  if name in excluded:
                      continue

                  if name.startswith("lib"):
                      continue

                  packages.add(name)

          with open("/tmp/packages.list", "w", encoding="utf-8") as output:
              output.write(" ".join(sorted(packages)))

          print(f"Packages selected: {len(packages)}")
          print("Excluded custom/system packages:", ", ".join(sorted(excluded)))
          PY

      - name: Verify AX6 profile
        run: |
          cd imagebuilder
          make info > /tmp/profiles.txt
          grep -F "xiaomi_redmi-ax6" /tmp/profiles.txt

      - name: Build firmware
        run: |
          cd imagebuilder

          PACKAGES="$(cat /tmp/packages.list)"

          make image \
            PROFILE="xiaomi_redmi-ax6" \
            PACKAGES="$PACKAGES" \
            FILES="files"

      - name: Verify firmware
        run: |
          IMAGE=$(find imagebuilder/bin/targets/qualcommax/ipq807x \
            -maxdepth 1 -type f \
            -name 'openwrt-*-redmi_ax6-squashfs-sysupgrade.bin' \
            -print -quit)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: AX6 sysupgrade image not found."
            exit 1
          fi

          echo "Firmware:"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6-openwrt-25.12.6
          path: |
            imagebuilder/bin/targets/qualcommax/ipq807x/*redmi_ax6-squashfs-sysupgrade.bin
            imagebuilder/bin/targets/qualcommax/ipq807x/*.manifest
          if-no-files-found: error
          retention-days: 30
