
name: Build Redmi AX6 firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gawk gettext libncurses-dev zlib1g-dev \
            file rsync wget zstd python3 ca-certificates

      - name: Check input files
        run: |
          test -s custom-files.tar.gz
          test -s packages.txt
          echo "Backup archive and package list found."

      - name: Download OpenWrt ImageBuilder
        run: |
          wget -O imagebuilder.tar.zst \
            https://downloads.openwrt.org/releases/25.12.6/targets/qualcommax/ipq807x/openwrt-imagebuilder-25.12.6-qualcommax-ipq807x.Linux-x86_64.tar.zst

          tar --zstd -xf imagebuilder.tar.zst

          mv openwrt-imagebuilder-25.12.6-qualcommax-ipq807x.Linux-x86_64 imagebuilder

      - name: Restore custom files
        run: |
          mkdir -p imagebuilder/files
          tar -xzpf custom-files.tar.gz -C imagebuilder/files

      - name: Configure package repository
        run: |
          cd imagebuilder

          FEED="https://openwrt.eamonxg.fun/snapshots/apk/packages.adb"

          grep -qxF "$FEED" repositories || echo "$FEED" >> repositories

          mkdir -p keys

          if [ -d files/etc/apk/keys ]; then
            cp -a files/etc/apk/keys/. keys/
          fi

          if [ -z "$(find keys -maxdepth 1 -type f -print -quit)" ]; then
            echo "ERROR: APK signing keys were not found in the backup."
            exit 1
          fi

      - name: Prepare package list
        run: |
          python3 - <<'PY'
          import re

          packages = set()

          with open("packages.txt", encoding="utf-8") as source:
              for line in source:
                  line = line.strip()
                  if not line:
                      continue

                  package = line.split()[0]
                  package = re.sub(r'-[0-9].*$', '', package)

                  if package in {"base-files", "kernel", "libc"}:
                      continue

                  packages.add(package)

          with open("/tmp/packages.list", "w", encoding="utf-8") as output:
              output.write(" ".join(sorted(packages)))

          print(f"Prepared {len(packages)} packages.")
          PY

      - name: Verify device profile
        run: |
          cd imagebuilder
          make info > /tmp/imagebuilder-profiles.txt
          grep -F "xiaomi_redmi-ax6" /tmp/imagebuilder-profiles.txt

      - name: Build firmware
        run: |
          cd imagebuilder

          PACKAGES="$(cat /tmp/packages.list)"

          make image \
            PROFILE="xiaomi_redmi-ax6" \
            PACKAGES="$PACKAGES" \
            FILES="files"

      - name: Verify firmware
        run: |
          IMAGE=$(find imagebuilder/bin/targets/qualcommax/ipq807x \
            -maxdepth 1 -type f \
            -name '*redmi_ax6-squashfs-sysupgrade.bin' \
            -print -quit)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Redmi AX6 sysupgrade image was not created."
            exit 1
          fi

          sha256sum "$IMAGE"
          ls -lh "$IMAGE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6-openwrt-25.12.6
          path: |
            imagebuilder/bin/targets/qualcommax/ipq807x/*redmi_ax6-squashfs-sysupgrade.bin
            imagebuilder/bin/targets/qualcommax/ipq807x/*.manifest
          if-no-files-found: error
          retention-days: 30
